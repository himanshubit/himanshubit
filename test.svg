<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
<style>
@keyframes a1 { from { fill: red; } to { fill: blue; } }
@keyframes a2 { from { fill: green; } to { fill: yellow; } }
rect { animation: a1 2s infinite alternate; }
svg:hover rect { animation-name: a2; }
</style>
<rect width="100" height="100"/>
</svg>
